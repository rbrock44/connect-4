<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Connect 4 board">
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#155dfc"/>
      <stop offset="0.5" stop-color="#1447e6"/>
      <stop offset="1" stop-color="#193cb8"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6467"/>
      <stop offset="0.5" stop-color="#fb2c36"/>
      <stop offset="1" stop-color="#c10007"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffdf20"/>
      <stop offset="0.5" stop-color="#fdc700"/>
      <stop offset="1" stop-color="#d08700"/>
    </linearGradient>
    <linearGradient id="empty" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="30" height="30" rx="6" fill="url(#board)" stroke="#2b7fff" stroke-width="1.5"/>

  <circle cx="8" cy="8" r="3.6" fill="url(#empty)"/>
  <circle cx="16" cy="8" r="3.6" fill="url(#empty)"/>
  <circle cx="24" cy="8" r="3.6" fill="url(#red)"/>

  <circle cx="8" cy="16" r="3.6" fill="url(#empty)"/>
  <circle cx="16" cy="16" r="3.6" fill="url(#red)"/>
  <circle cx="24" cy="16" r="3.6" fill="url(#yellow)"/>

  <circle cx="8" cy="24" r="3.6" fill="url(#red)"/>
  <circle cx="16" cy="24" r="3.6" fill="url(#yellow)"/>
  <circle cx="24" cy="24" r="3.6" fill="url(#yellow)"/>
</svg>
